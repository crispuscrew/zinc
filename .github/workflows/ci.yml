name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# The runner image is pinned rather than `ubuntu-latest`: every job here drives podman, so
# the runner's podman/crun pair is part of this build's toolchain, and `latest` moves it
# without warning. Two skews have already cost us a red build - podman 4.9 not
# understanding the `--health-cmd` exec form, and crun rejecting the OCI spec version
# podman handed it. Bump this deliberately, with the podman version in mind.
jobs:
  common:
    name: common (schema + validate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false # common and e2e have no external deps, so there is nothing to cache
      - name: gofmt
        working-directory: common
        run: |
          unformatted="$(gofmt -l $(find . -path ./vendor -prune -o -name '*.go' -print))"
          if [ -n "$unformatted" ]; then echo "needs gofmt:"; echo "$unformatted"; exit 1; fi
      - name: vet
        working-directory: common
        run: GOWORK=off go vet ./...
      - name: test
        working-directory: common
        run: GOWORK=off go test ./...

  check:
    name: check + build (${{ matrix.module }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        module: [container/runner, creator, launcher/tui, launcher/gui, virtualization/runner]
    steps:
      - uses: actions/checkout@v4
      - name: Ensure podman
        run: .github/scripts/ensure-podman.sh
      - name: make check
        run: make -C ${{ matrix.module }} check
      - name: make vendor-check
        run: make -C ${{ matrix.module }} vendor-check
      - name: make build
        run: make -C ${{ matrix.module }} build
      - name: make repro
        run: make -C ${{ matrix.module }} repro

  launcher-common:
    name: launcher/common (shared launcher lib)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Ensure podman
        run: .github/scripts/ensure-podman.sh
      - name: make check
        run: make -C launcher/common check
      - name: make vendor-check
        run: make -C launcher/common vendor-check

  menu:
    name: menu (menu lib)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Ensure podman
        run: .github/scripts/ensure-podman.sh
      - name: make check
        run: make -C menu check
      - name: make vendor-check
        run: make -C menu vendor-check

  e2e:
    name: end-to-end (podman)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache: false # common and e2e have no external deps, so there is nothing to cache
      - name: Ensure podman
        run: .github/scripts/ensure-podman.sh
      - name: make e2e
        run: make -C container/e2e e2e
        # A runner without rootless nftables can gate just the network scenario with:
        #   env:
        #     ZINC_E2E_NO_NET: "1"
