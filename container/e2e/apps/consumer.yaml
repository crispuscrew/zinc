SchemaVersion: 4
Type: ZincContainer
AppNameID: consumer
LauncherMeta:
  Description: provisioned app network - probe the producer's allowed and denied ports
ImageMeta:
  Image: localhost/zinc/e2e-app:local
StartConditions:
  Entrypoint: /probe.sh
  EntrypointEnv:
    PRODUCER_ADDRESS: 10.203.0.2
NetworkMeta:
  Interfaces:
    - ID: link
  RulesByPriority:
    - From: {Type: Self, Interface: link}
      To: {Type: App, AppNameID: producer, Interface: link}
      Protocols: [TCP]
