# Install explicitly; runners never change or restart the host audio service.
wireplumber.components = [
  { name = zinc-audio.lua, type = script/lua,
    provides = policy.zinc-audio,
    requires = [ policy.standard, pw.client-node, pw.node-factory.adapter ] }
]
wireplumber.profiles = {
  main = { policy.zinc-audio = required }
  policy = { policy.zinc-audio = required }
}
# Defense in depth for old Zinc contexts as well. This only narrows the fallback;
# it cannot replace the policy's explicit per-object grants with a broad grant.
access.rules = [
  { matches = [ { pipewire.sec.engine = "com.github.crispuscrew.zinc" } ]
    actions = { update-props = { access = "zinc-audio-v1", default_permissions = "-" } } }
]
