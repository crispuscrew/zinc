SchemaVersion: 4
Type: ZincContainer
AppNameID: attached-shell
LauncherMeta:
  Description: Shared offline terminal sessions
  Group: Dev
ImageMeta:
  Image: docker.io/library/alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
StartConditions:
  Entrypoint: /bin/sh
  EntrypointEnv: {MODE: primary}
  Terminal: true
  Attached: true
  AttachedEntrypoint: /bin/sh
  AttachedEnv: {MODE: attached}
  ReadOnlyRootfs: true
StopConditions:
  Background: true             # keep the holder after the last terminal closes
  Autorestart: false
DisplayMeta:
  DisableGpuAccess: true
NetworkMeta:
  Interfaces: []
Volumes:
  - InnerMount: /work
    SizeLimited: true
    SizeLimitMiB: 64
    Writable: true
    Executable: false
