# Derived-image terminal example. Install entries form one RUN layer.
SchemaVersion: 4
Type: ZincContainer

AppNameID: hollywood
LauncherMeta:
  Icon: utilities-terminal
  Description: Fake hacker terminal (demo of install + entrypoint)
  Group: Fun

ImageMeta:
  Image: docker.io/library/debian@sha256:ed49f2fa955a92dd859d7e2bdd101138b6db7ca855af572212d910d4e1445cc2
  Install:
    - apt-get update && apt-get install -y hollywood
    - useradd --create-home app

StartConditions:
  Entrypoint: hollywood
  Terminal: true            # runs in a terminal window

DisplayMeta:
  DisableSecurityContext: false
  DisableGpuAccess: true

NetworkMeta:
  Interfaces: []

InternalUserMeta:
  UseNonRootUser: true
  NonRootUserName: app
  KeepUserID: false

ResourcesMeta:
  MaxCPUCores: 1
  MaxRamMiB: 512
  PIDsLimit: 256

AudioMeta:
  Playback: {}
  Microphone: {}
  Monitor: {}

HostTheme: true
