# Connect to the server's provisioned IP; AppNameID does not create a DNS alias.
SchemaVersion: 4
Type: ZincContainer
AppNameID: network-server
LauncherMeta:
  Description: Server accepting only the named client's TCP traffic
ImageMeta:
  Image: docker.io/library/alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
StartConditions:
  Entrypoint: httpd -f -p 8080 -h /tmp
  ReadOnlyRootfs: true
DisplayMeta:
  DisableGpuAccess: true
NetworkMeta:
  Interfaces:
    - ID: service
  RulesByPriority:
    - From: {Type: App, AppNameID: network-client, Interface: primary}
      To:
        Type: Self
        Interface: service
        Filter: {Ports: [8080]}
      Protocols: [TCP]
