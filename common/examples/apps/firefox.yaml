# Offline browser example. See ../README.md for runtime prerequisites.
SchemaVersion: 4
Type: ZincContainer

AppNameID: firefox
LauncherMeta:
  Icon: firefox
  Description: Offline web browser
  Group: Web

ImageMeta:
  # A derived build joins Install entries in one RUN layer.
  Image: docker.io/library/alpine@sha256:48b0309ca019d89d40f670aa1bc06e426dc0931948452e8491e3d65087abc07d
  Install:
    - apk add --no-cache firefox font-dejavu
    # Match this UID to the launching user when adapting the example.
    - adduser -D -u 1000 app

StartConditions:
  Entrypoint: firefox        # process to run; empty = image default

DisplayMeta:
  RequireSecurityContext: true    # refuse compositors without the protocol
  DisableGpuAccess: true

NetworkMeta:
  Interfaces: []                 # no NIC; networked apps require provisioning

InternalUserMeta:
  UseNonRootUser: true            # run as a non-root user inside the container
  NonRootUserName: app
  KeepUserID: true               # app UID must map to the mode-0600 broker socket owner

ResourcesMeta:
  MaxCPUCores: 2                  # fractional allowed, e.g. 0.5
  MaxRamMiB: 2048
  PIDsLimit: 512                  # fork-bomb guard

AudioMeta:
  # Requires opt-in deployment of the Zinc WirePlumber policy. Native PipeWire
  # clients only; a PulseAudio-only browser needs a separately restricted frontend.
  Playback:
    PipeWireDefault: true
  Microphone: {}
  Monitor: {}

HostTheme: true                  # curated bundle, only if provided by the desktop
