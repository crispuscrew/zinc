# INTENTIONALLY INVALID values, but strictly decodable canonical field names.
# examples_test.go asserts every error below, including the unsupported version.
SchemaVersion: 1               # BUG: this build requires schema 4
Type: ZincContainer
AppNameID: Firefox             # BUG: uppercase app ID
LauncherMeta:
  Description: Deliberately invalid browser
ImageMeta:
  Image: docker.io/library/firefox@sha256:abc123 # BUG: incomplete digest
StartConditions:
  Entrypoint: firefox
  Attached: true               # BUG: Attached requires Terminal
ResourcesMeta:
  MaxCPUCores: -1               # BUG: negative quota
  MaxRamMiB: -256               # BUG: negative memory
Volumes:
  - InnerMount: /etc/hosts
    HostMounted: true
    HostMount: ""              # BUG: host source required
Keys:
  - Type: PGP                   # BUG: must be SSH or GPG
    Path: /home/example/.gnupg
NetworkMeta:
  Interfaces:
    - ID: primary
  RulesByPriority:
    - From: {Type: Self}
      To:
        Type: Internet
        Filter: {Ports: [443]}
      # BUG: ports require explicit TCP, UDP or SCTP in Protocols
